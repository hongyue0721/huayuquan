name: 词库呈批批复

on:
  issues:
    types: [opened, edited]

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  petition:
    runs-on: ubuntu-latest
    if: startsWith(github.event.issue.title, '【词库呈批】')
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 将呈文正文写入临时文件
        env:
          # 用环境变量传递，避免 shell 注入（不直接把正文拼进命令）
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -n "$ISSUE_BODY" ]; then
            printf '%s\n' "$ISSUE_BODY" > /tmp/issue_body.txt
          else
            : > /tmp/issue_body.txt
          fi

      - name: 呈批校验（生成 呈批方案.json、批复.md 与 拉取请求正文.md；驳回时退出码非零）
        id: check
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if python3 词库呈批.py --校验 /tmp/issue_body.txt --呈文号 "$ISSUE_NUMBER"; then
            echo "verdict=准予" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=驳回" >> "$GITHUB_OUTPUT"
          fi

      - name: 驳回：回驳回公文并结束
        if: steps.check.outputs.verdict == '驳回'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --body-file 批复.md

      - name: 准予：呈报分支、重建词典、开拉取请求、回批复公文
        if: steps.check.outputs.verdict == '准予'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="petition/issue-${ISSUE_NUMBER}"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            # 呈文被编辑后再次呈批：拉取既有分支在其上重做，推送强追
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            PUSH_OPT="--force-with-lease"
          else
            git checkout -B "$BRANCH"
            PUSH_OPT="-u"
          fi
          python3 词库呈批.py --应用 呈批方案.json
          python3 构建网页词典.py
          git add terms/contrib.json 词库.js
          if git diff --cached --quiet; then
            if git diff --quiet origin/master HEAD -- terms/contrib.json 词库.js; then
              # 真空更动：所呈词条于贡献词库查无在册（如纯删除不存在的词条），
              # 不建更动、不开拉取请求、不合并，回照复公文即了结
              printf '## 关于词库呈批的照复\n\n所呈删除之词条，贡献词库查无在册，未予更动，特此照复。\n' > 批复.md
              gh issue comment "$ISSUE_NUMBER" --body-file 批复.md
              exit 0
            fi
            # 重跑/重批：既有分支已含所呈更动（如前番流程中途崩殂），径直补走拉取请求流程
          else
            git commit -m "词库呈批：第 ${ISSUE_NUMBER} 号呈文所呈词条 [skip ci]"
            git push "$PUSH_OPT" origin "$BRANCH"
          fi
          # 该分支已有拉取请求则跳过创建（呈文编辑重批时复用原拉取请求）
          PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ -z "$PR_NUMBER" ]; then
            # 条数以蟒蛇语言统计（jq 不识中文键名，曾致流程中途崩殂）
            COUNT=$(python3 -c 'import json; d=json.load(open("呈批方案.json", encoding="utf-8")); print(len(d["添加"])+len(d["删除"]))')
            gh pr create --base master --head "$BRANCH" --title "词库呈批：第 ${ISSUE_NUMBER} 号呈文（增删 ${COUNT} 条）" --body-file 拉取请求正文.md
            PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          fi
          # 机器人代为御批：开呈即合并并清理分支；合并失败则留待站长亲批
          if gh pr merge "$PR_NUMBER" --squash --delete-branch; then
            printf '\n已转呈拉取请求 [#%s](https://github.com/hongyue0721/huayuquan/pull/%s)，由本机器人代为御批，词条即日入库生效。\n' "$PR_NUMBER" "$PR_NUMBER" >> 批复.md
          else
            printf '\n已转呈拉取请求 [#%s](https://github.com/hongyue0721/huayuquan/pull/%s)，候站长御批。\n' "$PR_NUMBER" "$PR_NUMBER" >> 批复.md
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file 批复.md
