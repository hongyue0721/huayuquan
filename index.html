<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>科技话语权赋能设备</title>
<script src="词库.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: #ffffff;
    color: #1a1a1a;
    font-family: "Songti SC", "Noto Serif CJK SC", "Source Han Serif SC", "SimSun", "PingFang SC", serif;
    font-size: 18px; /* 正文基准：全站无小于 18px 的文字 */
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    border-top: 6px solid #de2910;
  }

  /* ---------- 大标题 ---------- */
  header {
    text-align: center;
    padding: 30px 16px 22px;
    border-bottom: 3px double #d4af37;
    background: #ffffff;
  }
  h1 {
    margin: 0;
    font-size: 46px;
    font-weight: bold;
    color: #de2910;
    letter-spacing: 12px;
    text-indent: 12px; /* 抵消末字后间距，保证视觉居中 */
  }

  /* ---------- 计数器 ---------- */
  .counter {
    text-align: center;
    font-size: 15px;
    line-height: 1.7;
    color: #333333;
    margin: 6px auto;
  }
  .counter-num {
    color: #de2910;
    font-weight: bold;
    font-size: 17px;
  }

  /* ---------- 主区域 ---------- */
  main {
    flex: 1;
    width: 100%;
    max-width: 1080px;
    margin: 0 auto;
    padding: 22px 20px 10px;
  }
  .panes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px;
    margin-top: 18px;
  }
  .pane { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .pane label {
    text-align: center;
    font-size: 18px;
    font-weight: bold;
    color: #de2910;
    letter-spacing: 3px;
    padding: 8px 10px;
    border: 1px solid #d4af37;
    border-radius: 4px;
    background: #fff8e6;
  }
  textarea, #output {
    flex: 1;
    min-height: 240px;
    resize: vertical;
    border: 2px solid #d4af37;
    border-radius: 6px;
    background: #ffffff;
    padding: 14px 16px;
    font-size: 18px;
    line-height: 1.9;
    white-space: pre-wrap;
    word-break: break-word;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  /* 输入框：等宽字体、字号略小，与输出区衬线正文形成对照 */
  textarea {
    font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
    font-size: 16px;
  }
  #output { font-family: inherit; cursor: pointer; }
  textarea:focus { outline: none; border-color: #de2910; box-shadow: 0 0 0 3px rgba(222, 41, 16, 0.12); }

  /* ---------- 大按钮 ---------- */
  .button-row { text-align: center; margin-top: 26px; }
  #btn-translate {
    font-family: inherit;
    font-size: 22px;
    font-weight: bold;
    color: #ffffff;
    background: #de2910;
    border: 2px solid #d4af37;
    border-radius: 8px;
    padding: 14px 56px;
    letter-spacing: 6px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.2s ease;
    animation: btn-glow 3.2s ease-in-out 1.4s infinite;
  }
  #btn-translate:hover { background: #b3240d; transform: translateY(-2px); }
  #btn-translate:active { transform: translateY(1px) scale(0.97); }

  /* ---------- 未命中提示 ---------- */
  #hint {
    text-align: center;
    font-size: 18px;
    color: #8a3a2a;
    margin: 14px auto 0;
  }
  #hint[hidden] { display: none; }
  #hint a { color: #de2910; font-weight: bold; }

  /* ---------- 实时赋能设置（钥匙预置代码内，设置区不对访客展示） ---------- */
  #byok { display: none; }
  #byok-status { text-align: center; font-size: 16px; color: #8a3a2a; margin: 10px 0 2px; }
  #byok-status[hidden] { display: none; }

  /* ---------- 译后评价（👍/👎，一译一票，不跨次累加） ---------- */
  #vote-area {
    text-align: center;
    margin: 12px 0 4px;
  }
  #vote-area[hidden] { display: none; }
  #vote-prompt { font-size: 18px; color: #333333; margin: 0 0 8px; }
  .vote-btn {
    font-family: inherit;
    font-size: 18px;
    color: #ffffff;
    background: #de2910;
    border: 2px solid #d4af37;
    border-radius: 6px;
    padding: 8px 22px;
    margin: 0 8px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .vote-btn:hover { background: #b3240d; transform: translateY(-1px); }
  .vote-btn:active { transform: translateY(1px) scale(0.97); }
  .vote-btn[disabled] {
    background: #8a8a8a;
    border-color: #c9a33c;
    cursor: default;
    transform: none;
  }

  /* ---------- 词库.js 缺失提示 ---------- */
  #missing-warning {
    text-align: center;
    font-size: 18px;
    color: #a3160a;
    background: #ffe9e5;
    border-bottom: 1px solid #de2910;
    padding: 10px 16px;
  }
  #missing-warning[hidden] { display: none; }

  /* ---------- 底部声明 ---------- */
  footer {
    margin-top: 34px;
    padding: 20px 16px;
    text-align: center;
    font-size: 18px;
    color: #333333;
    border-top: 3px double #d4af37;
    background: #ffffff;
  }
  footer p { margin: 6px 0; }
  /* 页脚两行均调小至 13px：第一行项目说明、第二行个人声明，层级一致 */
  footer p.footer-sub { font-size: 13px; }

  /* ---------- 右上角固定按钮（重读公告 / 代码枢纽，层级低于公告 overlay） ---------- */
  .top-actions {
    position: fixed;
    top: 12px;
    right: 14px;
    z-index: 50; /* 低于 #announce-overlay 的 z-index:100，公告弹出时被遮住 */
    display: flex;
    gap: 8px;
  }
  .top-action {
    font-family: inherit;
    font-size: 14px;
    color: #b3240d;
    background: #ffffff;
    border: 2px solid #b3240d;
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    text-decoration: none;
    transition: background 0.2s ease, color 0.2s ease, transform 0.15s ease;
  }
  .top-action:hover { background: #de2910; color: #ffffff; transform: translateY(-1px); }
  .top-action:active { transform: translateY(1px); }

  /* ---------- 悬浮公告 ---------- */
  #announce-overlay {
    position: fixed;
    inset: 0;
    z-index: 100;
    background: rgba(0, 0, 0, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    animation: fade-in 0.3s ease-out both;
  }
  #announce-overlay[hidden] { display: none; }
  #announce-overlay.closing { animation: fade-out 0.25s ease-in both; }
  #announce-card {
    background: #ffffff;
    border: 3px solid #d4af37;
    border-radius: 8px;
    max-width: 680px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    padding: 26px 30px;
    box-shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
    animation: card-pop 0.38s cubic-bezier(0.2, 0.9, 0.3, 1.15) both;
  }
  #announce-overlay.closing #announce-card { animation: card-pop-out 0.25s ease-in both; }
  #announce-card h2 {
    margin: 0 0 14px;
    font-size: 24px;
    color: #de2910;
    line-height: 1.5;
  }
  #announce-card blockquote {
    margin: 14px 0;
    padding: 12px 16px;
    border-left: 4px solid #d4af37;
    background: #fff8e6;
  }
  #announce-card blockquote p { margin: 0; font-size: 18px; line-height: 1.9; }
  #announce-card p { margin: 12px 0; font-size: 18px; line-height: 1.9; }
  #announce-card a { color: #de2910; }
  #announce-close {
    display: block;
    width: 100%;
    margin-top: 20px;
    font-family: inherit;
    font-size: 20px;
    font-weight: bold;
    color: #ffffff;
    background: #de2910;
    border: 2px solid #d4af37;
    border-radius: 6px;
    padding: 10px 0;
    letter-spacing: 6px;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  #announce-close:hover { background: #b3240d; transform: translateY(-1px); }

  /* ---------- 动效（只用 transform/opacity，合成层完成，低性能设备无压力） ---------- */
  @keyframes fade-slide-down { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade-rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fade-out { from { opacity: 1; } to { opacity: 0; } }
  @keyframes card-pop { from { opacity: 0; transform: scale(0.92) translateY(12px); } to { opacity: 1; transform: scale(1) translateY(0); } }
  @keyframes card-pop-out { from { opacity: 1; transform: scale(1); } to { opacity: 0; transform: scale(0.94) translateY(10px); } }
  @keyframes num-pop { from { transform: scale(1.4); opacity: 0.2; } to { transform: scale(1); opacity: 1; } }
  @keyframes btn-glow { 0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0); } 50% { box-shadow: 0 0 22px 4px rgba(212, 175, 55, 0.55); } }

  /* 入场：标题下沉、计数器淡入、两栏依次升起、按钮最后到位 */
  header { animation: fade-slide-down 0.6s ease-out both; }
  .counter:nth-of-type(1) { animation: fade-in 0.6s ease-out 0.15s both; }
  .counter:nth-of-type(2) { animation: fade-in 0.6s ease-out 0.3s both; }
  .pane:nth-child(1) { animation: fade-rise 0.55s ease-out 0.2s both; }
  .pane:nth-child(2) { animation: fade-rise 0.55s ease-out 0.35s both; }
  .button-row { animation: fade-rise 0.55s ease-out 0.5s both; }

  /* 翻译结果与计数数字更新时的轻量反馈 */
  #output.flash { animation: fade-rise 0.45s ease-out; }
  .counter-num.updated { display: inline-block; animation: num-pop 0.4s ease-out; }

  /* 低性能/减动效偏好：关闭全部动画与过渡 */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ---------- 移动端（<768px）：两栏上下堆叠、按钮全宽 ---------- */
  @media (max-width: 767px) {
    h1 { font-size: 30px; letter-spacing: 4px; text-indent: 4px; }
    main { padding: 16px 14px 8px; }
    .panes { grid-template-columns: 1fr; }
    textarea, #output { min-height: 170px; }
    #btn-translate { width: 100%; letter-spacing: 4px; }
    #announce-card { padding: 20px 18px; }
    /* 右上角按钮缩到最小并贴边，避免遮住居中标题 */
    .top-actions { top: 8px; right: 10px; gap: 6px; }
    .top-action { font-size: 12px; padding: 3px 8px; }
    /* 评价按钮收紧留白，窄屏两枚并排不溢出 */
    .vote-btn { font-size: 16px; padding: 6px 12px; margin: 0 4px; }
  }
</style>
</head>
<body>
  <div id="missing-warning" hidden>请先运行 python3 构建网页词典.py</div>

  <header>
    <h1>科技话语权赋能设备</h1>
  </header>

  <main>
    <p class="counter">已掌握话语权人数：<span id="busuanzi_value_site_uv" class="counter-num"></span></p>
    <p class="counter">技术突破与文化自信双向赋能次数：<span id="counter-translations" class="counter-num">0</span></p>

    <div class="panes">
      <section class="pane">
        <label for="input">未被掌握的话语权</label>
        <textarea id="input" placeholder="粘贴中英混合文本，点击下方按钮后为您双向赋能…"></textarea>
      </section>
      <section class="pane">
        <label for="output" id="output-label">双向赋能话语权</label>
        <div id="output"></div>
      </section>
    </div>

    <div class="button-row">
      <button id="btn-translate">点击掌握话语权</button>
    </div>

    <p id="hint" hidden>尚有词汇未被掌握，可提交后台赋能：<a id="hint-link" href="#" target="_blank" rel="noopener">提交翻译请求</a></p>
    <p id="byok-status" hidden></p>

    <!-- 译后评价：翻译成功完成后展示，一译一票，不跨次累加 -->
    <div id="vote-area" hidden>
      <p id="vote-prompt">对此次赋能的结果评价如何？</p>
      <div>
        <button id="vote-up" class="vote-btn" type="button"></button>
        <button id="vote-down" class="vote-btn" type="button"></button>
      </div>
    </div>

    <!-- 词元钥匙预置于此（隐藏设置区，访客无需看见也无需操作） -->
    <details id="byok">
      <summary>实时赋能设置</summary>
      <div class="byok-grid">
        <label>API Key<input id="byok-key" type="password" autocomplete="off"></label>
        <label>Base URL<input id="byok-base" type="text"></label>
        <label>模型<input id="byok-model" type="text" value="astron-code-latest"></label>
      </div>
    </details>
  </main>

  <footer>
    <p class="footer-sub">此项目使用深度求索第四代闪光型号以及月之暗面第三代大模型在派编码鞍具上完成编码并托管到代码枢纽行动上</p>
    <p class="footer-sub">本人热爱祖国，热爱人民，此项目只为增强文化自信，赋能科技与文化自信共同进步</p>
  </footer>

  <!-- 右上角固定按钮：重读公告 / 代码枢纽（z-index 低于公告 overlay，公告弹出时被遮住） -->
  <div class="top-actions">
    <button id="btn-reread" class="top-action" type="button">重读公告</button>
    <a class="top-action" href="https://github.com/hongyue0721/huayuquan" target="_blank" rel="noopener">代码枢纽</a>
  </div>

  <!-- 悬浮公告：打开页面即显示，点击「已阅」关闭 -->
  <div id="announce-overlay" hidden>
    <div id="announce-card" role="dialog" aria-label="公告">
      <div id="announce-body"></div>
      <button id="announce-close">已阅</button>
    </div>
  </div>

<script src="//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js"
        onerror="document.getElementById('busuanzi_value_site_uv').textContent='统计中'"></script>
<script>
(function () {
  'use strict';

  // ---------- 词典 ----------
  var 词库 = window.词库 || {};
  var 会话词典 = {}; // 会话词典：小写 key → 中文译名
  var 有种子 = false;
  for (var k in 词库) {
    if (Object.prototype.hasOwnProperty.call(词库, k)) {
      会话词典[k.toLowerCase()] = 词库[k];
      有种子 = true;
    }
  }
  if (!有种子) {
    document.getElementById('missing-warning').hidden = false;
  }

  // ---------- 切分与最长匹配（与 设计.md / 翻译.py 一致，勿改） ----------
  var 英文段正则 = /[A-Za-z0-9]+(?:[ \t.+#_-][A-Za-z0-9]+)*/g;

  // 词边界检查：key 首尾若为字母/数字，相邻字符不得再是字母/数字
  // （防止常见短词切碎专有名词，如 ai 不再切碎 chain、son 不再切碎 Sonnet）
  function 是字母数字(字符) { return /[A-Za-z0-9]/.test(字符); }

  // 在段内位置找最长的词典命中（前缀匹配，与 翻译.py 一致）
  function 段内最长命中(段, 位置, 键集) {
    var 命中 = null;
    for (var i = 0; i < 键集.length; i++) {
      var 候选键 = 键集[i];
      var 长度 = 候选键.length;
      if (位置 + 长度 > 段.length) continue;
      if (段.substr(位置, 长度).toLowerCase() !== 候选键) continue;
      if (是字母数字(候选键[0]) && 位置 > 0 && 是字母数字(段[位置 - 1])) continue;
      if (是字母数字(候选键[长度 - 1]) && 位置 + 长度 < 段.length && 是字母数字(段[位置 + 长度])) continue;
      if (!命中 || 长度 > 命中.长) 命中 = { 键: 候选键, 长: 长度 };
    }
    return 命中;
  }

  // ---------- 阿拉伯数字本地转换（纯数字不进大语言模型，直接译为语文数字，大小写双写） ----------
  var 小写数字集 = ['零','一','二','三','四','五','六','七','八','九'];
  var 大写数字集 = ['零','壹','贰','叁','肆','伍','陆','柒','捌','玖'];
  var 小写单位集 = ['', '十', '百', '千'];
  var 大写单位集 = ['', '拾', '佰', '仟'];
  var 数位分节 = ['', '万', '亿', '万亿', '亿亿'];

  // 读一段（最多四位）：返回该段的小写/大写读法，段内零按规则补「零」
  function 读分节(段, 大写) {
    var 数位 = 大写 ? 大写数字集 : 小写数字集;
    var 单位 = 大写 ? 大写单位集 : 小写单位集;
    var 输出 = '';
    var 零 = false;
    for (var i = 0; i < 段.length; i++) {
      var d = 段.charCodeAt(i) - 48;
      var 位序 = 段.length - 1 - i;
      if (d === 0) {
        零 = true;
      } else {
        if (零 && 输出) 输出 += 数位[0];
        输出 += 数位[d] + 单位[位序];
        零 = false;
      }
    }
    return 输出;
  }

  // 整数读法：按 4 位一节，节间补「零」；小写按约定省略最高位「一十」的「一」
  function 整数读法(数字串, 大写) {
    var 数位 = 数字串.replace(/^0+/, '') || '0';
    if (数位 === '0') return '零';
    var 分节 = [];
    for (var i = 数位.length; i > 0; i -= 4) {
      var 起点 = (i - 4 < 0) ? 0 : i - 4;
      分节.push(数位.slice(起点, i));
    }
    var 输出 = '';
    for (var s = 分节.length - 1; s >= 0; s--) {
      var 段 = 读分节(分节[s], 大写);
      if (段) {
        if (s < 分节.length - 1 && 输出 && parseInt(分节[s], 10) < 1000) 输出 += '零';
        输出 += 段 + (s > 0 ? 数位分节[s] : '');
      }
    }
    if (!大写 && 输出.indexOf('一十') === 0 && 数字串.charAt(0) === '1' && 数字串.length % 4 === 2) {
      输出 = 输出.slice(1);
    }
    return 输出;
  }

  // 纯数字（^\d+(\.\d+)?$）→ 语文数字（小写（大写）），如 2000 → 二千（贰仟）、3.14 → 三点一四（叁点壹肆）
  function 数字转语文(串) {
    if (!/^\d+(\.\d+)?$/.test(串)) return null;
    var 分片 = 串.split('.');
    var 小写 = 整数读法(分片[0], false);
    var 大写 = 整数读法(分片[0], true);
    if (分片.length > 1) {
      var 小写尾 = '', 大写尾 = '';
      for (var i = 0; i < 分片[1].length; i++) {
        var d = 分片[1].charCodeAt(i) - 48;
        小写尾 += 小写数字集[d];
        大写尾 += 大写数字集[d];
      }
      小写 += '点' + 小写尾;
      大写 += '点' + 大写尾;
    }
    return 小写 + '（' + 大写 + '）';
  }

  // 整段未命中时：段内从左到右最长匹配切分（词典合查）
  // 返回 { 命中片段: [{起点,终点,键}], 数字片段: [{起点,终点,文本}], 未知片段: [{起点,终点,术语}] }
  function 段落规划(段) {
    var 键集 = Object.keys(会话词典);
    var 命中片段 = [];
    var 位置 = 0, 长度 = 段.length;
    while (位置 < 长度) {
      var 命中 = 段内最长命中(段, 位置, 键集);
      if (命中) { 命中片段.push({ 起点: 位置, 终点: 位置 + 命中.长, 键: 命中.键 }); 位置 += 命中.长; }
      else 位置++;
    }
    // 匹配之间的空隙：先整段查词典（如已缓存的残余词条），再收为未知词。
    // 残余原样保留（含边缘空白）。
    var 数字片段 = [];
    var 未知片段 = [];
    var 空位 = 0, 序号 = 0;
    while (空位 < 长度) {

  // 整段切分：返回 { 片段表: [{起点,终点,文本}], 未知列表: [{起点,终点,术语}] }

  // 原位回填：译名替换对应区间，不加任何空格，其余字符原封不动

    }

      } else {

      }

    }

    } else {
      评价提示.textContent = '已收到您的评价';
      待评补译结果 = null; // 丢弃本次新词，不写入缓存
      自带钥匙状态.textContent = '您的指责是我们通往文化自信的动力';
      自带钥匙状态.hidden = false;
    }
  }

  赞同按钮.addEventListener('click', function () { 提交评价(true); });
  不赞同按钮.addEventListener('click', function () { 提交评价(false); });
  重置评价区(); // 初始化：按钮文案固定为「👍 赞同」「👎 不赞同」

  // ---------- 计数器（动态更新） ----------
  // 已掌握话语权人数：busuanzi 站点 UV，每 60 秒重拉一次保持新鲜；加载失败显示「统计中」
  var 访客数框 = document.getElementById('busuanzi_value_site_uv');
  var 上次访客数 = '';
  // 数值变化时重放弹跳动效
  new MutationObserver(function () {
    var t = 访客数框.textContent.trim();
    if (/^[\d,]+$/.test(t) && t !== 上次访客数) {
      上次访客数 = t;
      访客数框.classList.remove('updated');
      void 访客数框.offsetWidth;
      访客数框.classList.add('updated');
    }
  }).observe(访客数框, { childList: true, characterData: true, subtree: true });
  var 访客数起始 = Date.now();
  (function 轮询访客数() {
    if (访客数框.textContent.trim() !== '') return;       // 已取到数值
    if (Date.now() - 访客数起始 > 10000) { 访客数框.textContent = '统计中'; return; }
    setTimeout(轮询访客数, 500);
  })();
  setInterval(function () {                            // 每 60 秒重新拉取
    var s = document.createElement('script');
    s.async = true;
    s.src = '//busuanzi.ibruce.info/busuanzi/2.3/busuanzi.pure.mini.js?r=' + Date.now();
    document.body.appendChild(s);
  }, 60000);

  // 技术突破与文化自信双向赋能次数（合计口径）：
  //   远端 = GitHub Action 后台工作流累加 counters.json，前端每 30 秒轮询一次；
  //   本机 = 前端实时赋能每次实际发起大语言模型调用（含失败重试）累加 localStorage（键 hyq-local-llm-calls）。
  //   显示值 = 远端 + 本机，二者任一变化即重放弹跳动效。
  var 计数框 = document.getElementById('counter-translations');
  var 远端累计 = 0;  // 远端后台累计（counters.json，轮询刷新）
  var 上次合计 = null; // 上一次显示的合计值，用于触发弹跳动效
  var 本机调用存储键 = 'hyq-local-llm-calls';
  // 读取本机实时赋能调用计数：读不到/非法按 0
  function 读本机调用() {
    try {
      var n = parseInt(localStorage.getItem(本机调用存储键), 10);
      return (typeof n === 'number' && n >= 0) ? n : 0;
    } catch (e) { return 0; }
  }
  var 本机累计 = 读本机调用(); // 本机实时赋能累计：以 localStorage 为持久层，内存缓存供显示
  // 写穿持久化：隐私模式等写入失败时静默忽略（仅影响下次打开页面的初始值，不影响本次显示）
  function 写本机调用() {
    try { localStorage.setItem(本机调用存储键, String(本机累计)); } catch (e) { /* 忽略 */ }
  }
  // 统一刷新计数显示：合计 = 远端后台累计 + 本机实时赋能累计
  function 渲染计数() {
    var 合计 = 远端累计 + 本机累计;
    if (合计 !== 上次合计) {
      上次合计 = 合计;
      计数框.textContent = 合计;
      计数框.classList.remove('updated');
      void 计数框.offsetWidth;
      计数框.classList.add('updated');
    }
  }
  // 本机实时赋能每发起一次大语言模型调用：计数 +1 并立即刷新显示（由 补译术语 挂钩调用）
  function 累加本机调用() {
    本机累计 += 1;
    写本机调用();
    渲染计数();
  }
  function 轮询翻译计数() {
    fetch('counters.json', { cache: 'no-store' })
      .then(function (响应) { if (!响应.ok) throw new Error('HTTP ' + 响应.status); return 响应.json(); })
      .then(function (数据) {
        var 值 = 数据 && 数据.translations;
        值 = (typeof 值 === 'number' && 值 >= 0) ? 值 : 0;
        远端累计 = 值;
        渲染计数();
      })
      .catch(function () { if (上次合计 === null) { 上次合计 = 0; 计数框.textContent = 0; } });
  }
  轮询翻译计数();
  setInterval(轮询翻译计数, 30000);

  // ---------- 悬浮公告（自写迷你 md 渲染器） ----------
  // 公告原文，一字不改
  var 公告原文 = [
    '## 人民锐评：用"Token"还是"词元"，事关科技话语权',
    '',
    '> 术语是科技叙事的基础单元，若核心概念的定义权、阐释权始终掌握在他人手中，中国特色科技话语体系便无从建立。这种认知层面的依附，比技术差距更隐蔽，也更影响我国科技自立自强的长远发展。',
    '',
    '> 语言为科技载道，文化为发展立根。唯有筑牢母语根基、掌握话语主动权，我们才能在全球科技竞争中，实现技术突破与文化自信的双向赋能，助力科技强国建设行稳致远。',
    '',
    '—— [人民网·观点频道，2026年8月5日](http://opinion.people.com.cn/n1/2026/0805/c436867-40774551.html)',
    '',
    '本项目旨在科技文化双向赋能，增加科技话语权。'
  ].join('\n');

  // 行内格式：**粗体** 与 [文字](url)
  function 行内格式(s) {
    return s
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  // 块级：## 标题、> 引用、段落
  function 渲染公告(md) {
    var 行集 = md.split('\n');
    var 网页代码 = '';
    var i = 0;
    while (i < 行集.length) {
      var 行 = 行集[i];
      if (/^##\s+/.test(行)) {
        网页代码 += '<h2>' + 行内格式(行.replace(/^##\s+/, '')) + '</h2>';
        i++;
      } else if (/^>\s?/.test(行)) {
        var 引文 = [];
        while (i < 行集.length && /^>\s?/.test(行集[i])) {
          引文.push(行集[i].replace(/^>\s?/, ''));
          i++;
        }
        网页代码 += '<blockquote>' + 引文.map(function (q) {
          return '<p>' + 行内格式(q) + '</p>';
        }).join('') + '</blockquote>';
      } else if (行.trim() === '') {
        i++;
      } else {
        var 段落 = [];
        while (i < 行集.length && 行集[i].trim() !== ''
               && !/^##\s+/.test(行集[i]) && !/^>\s?/.test(行集[i])) {
          段落.push(行集[i]);
          i++;
        }
        网页代码 += '<p>' + 行内格式(段落.join('<br>')) + '</p>';
      }
    }
    return 网页代码;
  }

  var 公告层 = document.getElementById('announce-overlay');
  document.getElementById('announce-body').innerHTML = 渲染公告(公告原文);
  公告层.hidden = false; // 打开页面即显示
  var 关闭定时器 = null;
  document.getElementById('announce-close').addEventListener('click', function () {
    公告层.classList.add('closing'); // 播放淡出/缩小动效后再隐藏
    关闭定时器 = setTimeout(function () { 公告层.hidden = true; }, 240);
  });
  // 右上角「重读公告」：复用现有公告 DOM，取消隐藏并去掉 closing 类即可重新展示
  document.getElementById('btn-reread').addEventListener('click', function () {
    if (关闭定时器) { clearTimeout(关闭定时器); 关闭定时器 = null; }
    公告层.classList.remove('closing');
    公告层.hidden = false;
  });
})();

</script>
</body>
